name: Octra App release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version and env
        shell: pwsh
        env:
          TAG_OR_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:TAG_OR_INPUT.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $files = @(
            'apps/app-frontend/package.json',
            'apps/app/Cargo.toml',
            'packages/app-lib/Cargo.toml'
          )
          foreach ($file in $files) {
            (Get-Content $file -Raw) -replace '1\.0\.0-local', $version | Set-Content $file -NoNewline
          }
          Copy-Item packages/app-lib/.env.prod packages/app-lib/.env -Force

      - name: Build Octra App (updater payload)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/app
        run: pnpm run tauri build --config tauri-release.conf.json --bundles nsis

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $appExe = Get-ChildItem 'target/release' -Filter 'Octra App.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) {
            $appExe = Get-ChildItem 'apps/app/target/release' -Filter 'Octra App.exe' | Select-Object -First 1
          }
          if (-not $appExe) { throw 'Octra App.exe not found in target/release' }
          New-Item -ItemType Directory -Force -Path 'apps/installer/resources/payload' | Out-Null
          $payloadZip = Join-Path $PWD 'apps/installer/resources/payload/app.zip'
          if (Test-Path $payloadZip) { Remove-Item $payloadZip -Force }
          Push-Location $appExe.DirectoryName
          Compress-Archive -Path $appExe.Name -DestinationPath $payloadZip -Force
          Pop-Location
          if (-not (Test-Path $payloadZip)) { throw 'app.zip was not created' }
          $payloadSize = (Get-Item $payloadZip).Length
          if ($payloadSize -lt 1MB) { throw "app.zip is too small ($payloadSize bytes)" }
          Write-Host "Prepared app.zip ($([math]::Round($payloadSize / 1MB, 2)) MB)"

      - name: Build Octra Setup (custom installer UI)
        working-directory: apps/installer
        run: pnpm run build

      - name: Verify Octra Setup payload
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'target/release' -Filter 'Octra Setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem 'apps/installer/target/release' -Filter 'Octra Setup.exe' | Select-Object -First 1
          }
          if (-not $setup) { throw 'Octra Setup.exe not found after build' }
          $setupSize = $setup.Length
          if ($setupSize -lt 15MB) {
            throw "Octra Setup.exe is too small ($setupSize bytes) — app.zip was not embedded"
          }
          Write-Host "Octra Setup.exe size OK ($([math]::Round($setupSize / 1MB, 2)) MB)"

      - name: Pack release assets
        shell: pwsh
        run: |
          $nsis = 'target/release/bundle/nsis'
          if (-not (Test-Path $nsis)) { $nsis = 'apps/app/target/release/bundle/nsis' }
          $setup = Get-ChildItem 'target/release' -Filter 'Octra Setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem 'apps/installer/target/release' -Filter 'Octra Setup.exe' | Select-Object -First 1
          }
          if (-not $setup) { throw 'Octra Setup.exe not found in target/release' }
          $out = 'dist-installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $setup.FullName "$out/Octra-setup.exe"
          $zip = Get-ChildItem $nsis -Filter '*.nsis.zip' | Select-Object -First 1
          $sig = Get-ChildItem $nsis -Filter '*.nsis.zip.sig' | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "$out/Octra-setup.nsis.zip" }
          if ($sig) {
            Copy-Item $sig.FullName "$out/Octra-setup.nsis.zip.sig"
            $signature = (Get-Content $sig.FullName -Raw).Trim()
            $notes = "Octra App $($env:VERSION) — nowy launcher. Zastępuje Octra Launcher."
            $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/v$($env:VERSION)/Octra-setup.nsis.zip"
            $manifest = [ordered]@{
              version = $env:VERSION
              notes = $notes
              pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = @{
                'windows-x86_64' = @{
                  signature = $signature
                  url = $url
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 6 | Set-Content "$out/latest.json" -Encoding utf8
          }

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$($env:VERSION)"
          $files = @(
            'dist-installer/Octra-setup.exe',
            'dist-installer/Octra-setup.nsis.zip',
            'dist-installer/Octra-setup.nsis.zip.sig',
            'dist-installer/latest.json'
          ) | Where-Object { Test-Path $_ }
          $notes = "Octra App $($env:VERSION) replaces Octra Launcher. Instances import from .octralauncher on first launch."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Octra App $tag" --notes $notes --latest
          }
