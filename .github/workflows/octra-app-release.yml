name: Octra App release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version and env
        shell: pwsh
        env:
          TAG_OR_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:TAG_OR_INPUT.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $files = @(
            'apps/app-frontend/package.json',
            'apps/app/Cargo.toml',
            'packages/app-lib/Cargo.toml'
          )
          foreach ($file in $files) {
            (Get-Content $file -Raw) -replace '1\.0\.0-local', $version | Set-Content $file -NoNewline
          }
          Copy-Item packages/app-lib/.env.prod packages/app-lib/.env -Force

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --bundles nsis

      - name: Pack release assets
        shell: pwsh
        run: |
          $nsis = 'target/release/bundle/nsis'
          $out = 'dist-installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem $nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found' }
          Copy-Item $exe.FullName "$out/Octra-setup.exe"
          $zip = Get-ChildItem $nsis -Filter '*.nsis.zip' | Select-Object -First 1
          $sig = Get-ChildItem $nsis -Filter '*.nsis.zip.sig' | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "$out/Octra-setup.nsis.zip" }
          if ($sig) {
            Copy-Item $sig.FullName "$out/Octra-setup.nsis.zip.sig"
            $signature = (Get-Content $sig.FullName -Raw).Trim()
            $notes = "Octra App $($env:VERSION) — nowy launcher. Zastępuje Octra Launcher."
            $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/v$($env:VERSION)/Octra-setup.nsis.zip"
            $manifest = [ordered]@{
              version = $env:VERSION
              notes = $notes
              pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = @{
                'windows-x86_64' = @{
                  signature = $signature
                  url = $url
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 6 | Set-Content "$out/latest.json" -Encoding utf8
          }

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$($env:VERSION)"
          $files = @(
            'dist-installer/Octra-setup.exe',
            'dist-installer/Octra-setup.nsis.zip',
            'dist-installer/Octra-setup.nsis.zip.sig',
            'dist-installer/latest.json'
          ) | Where-Object { Test-Path $_ }
          gh release create $tag @files --title "Octra App $tag" --notes "Octra App $($env:VERSION) replaces Octra Launcher. Instances import from .octralauncher on first launch." --latest
