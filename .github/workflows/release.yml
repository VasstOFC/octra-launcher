name: Release

on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:windows

      - name: Sign installer + write latest.json
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCTRA_RELEASE_NOTES: Octra Launcher ${{ github.ref_name }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            node scripts/pack-installer.mjs --sign --write-manifest
            if ($LASTEXITCODE -eq 0) {
              echo "signed=true" >> $env:GITHUB_OUTPUT
            } else {
              Write-Warning "Podpisywanie nie powiodło się — publikuję bez latest.json (sprawdź TAURI_SIGNING_PRIVATE_KEY_PASSWORD)."
              echo "signed=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Warning "Brak TAURI_SIGNING_PRIVATE_KEY — publikuję tylko Octra-setup.exe (bez auto-updatera)."
            echo "signed=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Create GitHub Release (signed)
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Octra Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-installer/Octra-setup.exe
            dist-installer/latest.json
            dist-installer/Octra-setup.exe.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (unsigned)
        if: steps.sign.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Octra Launcher ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Uwaga:** brak `TAURI_SIGNING_PRIVATE_KEY` w GitHub Actions — auto-updater (latest.json) nie został opublikowany.
            Pobierz `Octra-setup.exe` ręcznie lub dodaj sekret i opublikuj ponownie.
          files: dist-installer/Octra-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
