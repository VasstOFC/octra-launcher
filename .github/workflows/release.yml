name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Build signed installer + latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OCTRA_RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          npm run dist:windows
          if ("$env:TAURI_SIGNING_PRIVATE_KEY") {
            node scripts/pack-installer.mjs --sign --write-manifest
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-installer/Octra-setup.exe
            dist-installer/latest.json
            dist-installer/Octra-setup.exe.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
